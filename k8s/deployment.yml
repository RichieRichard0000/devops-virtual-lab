apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lab-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-lab
  template:
    metadata:
      labels:
        app: devops-lab
    spec:
      containers:
        - name: devops-lab-app
          image: devops-lab-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
