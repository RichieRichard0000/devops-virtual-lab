name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          scope: 'devanshb27/devops-lab-app@push'

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab-app:latest

      - name: Deploy to Kubernetes on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab-app:${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/devops-vle-key.pem
          chmod 600 ~/.ssh/devops-vle-key.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/devops-vle-key.pem ubuntu@"$EC2_HOST" << EOF
            set -e

            echo "Pulling Docker image..."
            docker pull "$IMAGE"

            echo "Loading image into Minikube..."
            minikube image load "$IMAGE"

            echo "Updating Kubernetes deployment..."
            kubectl set image deployment/devops-lab-deployment \
              devops-lab-app="$IMAGE"

            echo "Waiting for rollout..."
            kubectl rollout status deployment/devops-lab-deployment --timeout=120s

            echo "Deployment successful."
            kubectl get pods
            kubectl get services
          EOF
